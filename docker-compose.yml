version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./magic-ledger-app
    ports:
      - "3000:3000"
    volumes:
      - ./magic-ledger-app:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  backend_data:
